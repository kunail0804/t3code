# Fork-only : surveille l'écart avec pingdotgg/t3code et la release du fork.
# Ne touche jamais la branche de travail — le rebase reste une décision locale.
name: fork sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      # Pourquoi le job ne pousse pas main avec le jeton d'Actions.
      #
      # Le GITHUB_TOKEN est un jeton d'application GitHub. GitHub refuse à une
      # application de créer ou modifier un fichier `.github/workflows/**` sans
      # la permission `workflows`, et cette permission n'existe pas dans le bloc
      # `permissions:` d'un workflow : aucun réglage ne la débloque. Upstream
      # touche un workflow presque chaque semaine, donc le push était rejeté
      # presque chaque jour. Ce n'était pas un conflit de merge.
      #
      # L'API `merge-upstream` (le bouton « Sync fork ») ne contourne rien : le
      # 2026-09-17, run 35241978355, elle a renvoyé le même refus en 422.
      # Mesuré, pas supposé.
      #
      # Il reste un seul chemin : un jeton personnel, qui n'est pas un jeton
      # d'application. Crée un PAT classique avec les portées `repo` et
      # `workflow`, pose-le en secret de dépôt `FORK_SYNC_TOKEN`, et ce job
      # avancera main tout seul. Sans le secret il se contente de mesurer le
      # retard : c'est `./fork/sync.sh`, lancé à la main, qui pousse main.
      - name: Aligner main sur upstream
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$FORK_SYNC_TOKEN" ]; then
            echo "::notice::Pas de secret FORK_SYNC_TOKEN : main n'est pas avancé ici. Ce job se limite à la surveillance."
            exit 0
          fi

          RESULT="$(GH_TOKEN="$FORK_SYNC_TOKEN" gh api -X POST \
            "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main 2>&1)" || {
              echo "::error::merge-upstream a échoué : $RESULT"
              echo "Un 409 signifie que main a divergé d'upstream. main est un miroir strict : on n'y commit jamais. Répare-le localement avant de relancer."
              exit 1
            }

          MERGE_TYPE="$(echo "$RESULT" | jq -r '.merge_type')"
          case "$MERGE_TYPE" in
            fast-forward) echo "main avancé sur upstream/main" ;;
            none)         echo "main déjà à jour" ;;
            merge)
              # GitHub a déjà écrit le commit de merge quand on lit ça : rien à
              # annuler ici. Le signaler fort, parce que main n'est plus un
              # miroir strict et que le prochain rebase de la branche de travail
              # rejouerait des commits qui ne viennent pas d'upstream.
              echo "::error::main a reçu un commit de merge : ce n'est plus un miroir strict d'upstream. Quelque chose a commité sur main."
              exit 1
              ;;
            *)
              echo "::error::réponse inattendue de merge-upstream : $RESULT"
              exit 1
              ;;
          esac

      # Les tags d'upstream ne sont pas recopiés, même avec un PAT. Ils
      # faisaient partie du push rejeté, et leur motif `v*.*.*` est celui sous
      # lequel `fork/release.sh` publie les releases du fork : les recopier
      # garantit une collision le jour où les deux numéros se croisent.

      # Un workflow d'upstream ne peut pas tourner ici : ils visent tous des
      # runners `blacksmith-*` que le fork n'a pas. Leurs jobs attendent 24 h
      # dans la file puis sont annules, et ceux qui declarent
      # `environment: production` laissent derriere eux un deploiement en
      # erreur — la vague de mails « deployment failed » du 2026-09.
      #
      # Ils sont desactives dans les reglages du depot plutot que dans les
      # fichiers : modifier un fichier de base coute un conflit a chaque
      # rebase, l'etat « disabled » survit a tous les syncs.
      #
      # Sauf qu'un workflow qu'upstream ajoute ou renomme se reenregistre comme
      # neuf, donc actif. C'est arrive au premier sync : `release.yml` est
      # devenu `release-desktop.yml` et `desktop-macos-preview.yml` est devenu
      # `desktop-macos-preview-publish.yml`, tous deux actifs. Cette etape
      # ferme le trou au lieu de compter sur quelqu'un pour y penser.
      #
      # `dynamic/` est le workflow Dependabot du graphe de dependances : il
      # n'est pas un fichier du depot et l'API refuse de le desactiver (422).
      # Il ne cree pas de deploiement, on le laisse.
      - name: Desactiver les workflows d'upstream reapparus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
            -q '.workflows[] | select(.state == "active") | select(.name != "fork sync") | select(.path | startswith("dynamic/") | not) | "\(.id)|\(.name)"' \
            > /tmp/active-workflows.txt

          if [ ! -s /tmp/active-workflows.txt ]; then
            echo "aucun workflow d'upstream actif"
            exit 0
          fi

          while IFS='|' read -r id name; do
            [ -z "$id" ] && continue
            echo "::warning::Workflow d'upstream actif sur le fork, desactive : $name"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"
            echo "- desactive : \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/active-workflows.txt

      - name: Mesurer le retard sur upstream
        id: lag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM="$(gh api "repos/$GITHUB_REPOSITORY" -q '.parent.full_name')"
          FORK_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q '.sha')"
          UP_MAIN="$(gh api "repos/$UPSTREAM/commits/main" -q '.sha')"

          # Comparaison faite chez upstream : main est un miroir strict, donc
          # son commit y existe et sert de base valide.
          BEHIND="$(gh api "repos/$UPSTREAM/compare/$FORK_MAIN...$UP_MAIN" -q '.ahead_by')"

          echo "upstream: $UPSTREAM"
          echo "retard: $BEHIND commits"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "- \`main\` est à **$BEHIND** commits derrière \`$UPSTREAM\`" >> "$GITHUB_STEP_SUMMARY"

      # Tourne aussi quand main est déjà à jour : une release peut manquer ou
      # être cassée sans nouveau commit.
      #
      # Jusqu'au 2026-09-23, cette étape vérifiait seulement qu'une release
      # portait le numéro de version d'upstream. Upstream a empilé 240 commits
      # sous 0.0.42 et elle répondait « rien à faire ». Elle compte maintenant
      # des commits, pas des numéros, et tient une seule issue à jour : ouverte
      # quand il faut agir, fermée seule quand tout est rattrapé.
      - name: Signale un fork en retard ou une release inexploitable
        env:
          GH_TOKEN: ${{ github.token }}
          # Seuil d'ouverture de l'issue. Upstream pousse de l'ordre de 40
          # commits par jour en septembre 2026 : 100, c'est environ trois jours.
          MAX_LAG: "100"
        run: |
          REPO="$GITHUB_REPOSITORY"
          WORK="$(gh api "repos/$REPO" -q '.default_branch')"
          FINDINGS=""
          add() { FINDINGS="${FINDINGS}- $1"$'\n'; }

          # 1. La branche de travail rejoue-t-elle main ?
          WORK_LAG="$(gh api "repos/$REPO/compare/$WORK...main" -q '.ahead_by')"
          echo "$WORK en retard sur main : $WORK_LAG commits"
          if [ "$WORK_LAG" -ge "$MAX_LAG" ]; then
            add "\`$WORK\` a **$WORK_LAG** commits de retard sur \`main\` : il faut rebaser (\`./fork/sync.sh\`)."
          fi

          # 2. La dernière release est-elle complète, et sur quelle base ?
          # Sans tag, `gh release view` rend la release « latest » de GitHub,
          # qui exclut brouillons et prereleases : exactement celle que lit
          # l'updater. release.sh écrit « base upstream <sha> » dans ses notes.
          if INFO="$(gh release view --repo "$REPO" --json tagName,assets,body 2>/dev/null)"; then
            TAG="$(echo "$INFO" | jq -r '.tagName')"
            VERSION="${TAG#v}"
            HAS_APPIMAGE="$(echo "$INFO" | jq -r --arg a "T3-Code-$VERSION-x86_64.AppImage" '[.assets[].name] | index($a) != null')"
            HAS_YML="$(echo "$INFO" | jq -r '[.assets[].name] | index("latest-linux.yml") != null')"
            if [ "$HAS_APPIMAGE" != "true" ] || [ "$HAS_YML" != "true" ]; then
              add "La release \`$TAG\` n'a pas ses deux assets (\`T3-Code-$VERSION-x86_64.AppImage\` et \`latest-linux.yml\`) : l'updater téléchargerait un 404."
            fi
            BASE="$(echo "$INFO" | jq -r '.body' | sed -nE 's/.*base upstream ([0-9a-f]{7,40}).*/\1/p' | head -1)"
            if [ -n "$BASE" ] && RELEASE_LAG="$(gh api "repos/$REPO/compare/$BASE...main" -q '.ahead_by' 2>/dev/null)"; then
              echo "release $TAG : base upstream $BASE, $RELEASE_LAG commits derrière main"
              if [ "$RELEASE_LAG" -ge "$MAX_LAG" ]; then
                add "La release \`$TAG\` est construite sur une base qui a **$RELEASE_LAG** commits de retard : il faut reconstruire puis publier (\`./fork/build-linux.sh\`, puis \`./fork/release.sh\`)."
              fi
            else
              add "Les notes de la release \`$TAG\` n'indiquent pas de base upstream lisible : son retard ne peut pas être mesuré."
            fi
          else
            add "Aucune release publiée : l'updater du fork ne propose rien."
          fi

          TITLE="Fork en retard sur upstream : sync ou release à faire"
          NUMBER="$(gh issue list --repo "$REPO" --state open --limit 500 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"

          if [ -z "$FINDINGS" ]; then
            echo "rien à signaler"
            echo "- rien à signaler" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$NUMBER" ]; then
              gh issue close "$NUMBER" --repo "$REPO" \
                --comment "Rattrapé : branche de travail et release à moins de $MAX_LAG commits de \`main\`."
            fi
            exit 0
          fi

          printf '%s' "$FINDINGS" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "Relevé du $(date -u +%Y-%m-%d) :"
            echo
            printf '%s\n' "$FINDINGS"
            echo "Procédure, depuis la machine de dev : \`./fork/sync.sh\`, puis \`./fork/build-linux.sh\`, puis \`./fork/release.sh\`."
            echo
            echo "Cette issue est réécrite à chaque passage et se ferme seule quand tout est rattrapé."
          } > /tmp/fork-issue.md

          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --repo "$REPO" --body-file /tmp/fork-issue.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/fork-issue.md
          fi
