# Fork-only : garde `main` aligné sur pingdotgg/t3code sans intervention.
# Ne touche jamais la branche de travail — le rebase reste une décision locale.
name: fork sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main sur upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main --tags
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "retard: $BEHIND commits"
          if [ "$BEHIND" -eq 0 ]; then
            echo "deja a jour"
            exit 0
          fi
          # --ff-only : si main a divergé, le job échoue au lieu d'écraser.
          git merge --ff-only upstream/main
          git push origin main --tags
