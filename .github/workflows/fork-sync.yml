# Fork-only : surveille l'écart avec pingdotgg/t3code et la release du fork.
# Ne touche jamais la branche de travail — le rebase reste une décision locale.
name: fork sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      # Pourquoi le job ne pousse pas main avec le jeton d'Actions.
      #
      # Le GITHUB_TOKEN est un jeton d'application GitHub. GitHub refuse à une
      # application de créer ou modifier un fichier `.github/workflows/**` sans
      # la permission `workflows`, et cette permission n'existe pas dans le bloc
      # `permissions:` d'un workflow : aucun réglage ne la débloque. Upstream
      # touche un workflow presque chaque semaine, donc le push était rejeté
      # presque chaque jour. Ce n'était pas un conflit de merge.
      #
      # L'API `merge-upstream` (le bouton « Sync fork ») ne contourne rien : le
      # 2026-09-17, run 35241978355, elle a renvoyé le même refus en 422.
      # Mesuré, pas supposé.
      #
      # Il reste un seul chemin : un jeton personnel, qui n'est pas un jeton
      # d'application. Crée un PAT classique avec les portées `repo` et
      # `workflow`, pose-le en secret de dépôt `FORK_SYNC_TOKEN`, et ce job
      # avancera main tout seul. Sans le secret il se contente de mesurer le
      # retard : c'est `./fork/sync.sh`, lancé à la main, qui pousse main.
      - name: Aligner main sur upstream
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$FORK_SYNC_TOKEN" ]; then
            echo "::notice::Pas de secret FORK_SYNC_TOKEN : main n'est pas avancé ici. Ce job se limite à la surveillance."
            exit 0
          fi

          RESULT="$(GH_TOKEN="$FORK_SYNC_TOKEN" gh api -X POST \
            "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main 2>&1)" || {
              echo "::error::merge-upstream a échoué : $RESULT"
              echo "Un 409 signifie que main a divergé d'upstream. main est un miroir strict : on n'y commit jamais. Répare-le localement avant de relancer."
              exit 1
            }

          MERGE_TYPE="$(echo "$RESULT" | jq -r '.merge_type')"
          case "$MERGE_TYPE" in
            fast-forward) echo "main avancé sur upstream/main" ;;
            none)         echo "main déjà à jour" ;;
            merge)
              # GitHub a déjà écrit le commit de merge quand on lit ça : rien à
              # annuler ici. Le signaler fort, parce que main n'est plus un
              # miroir strict et que le prochain rebase de la branche de travail
              # rejouerait des commits qui ne viennent pas d'upstream.
              echo "::error::main a reçu un commit de merge : ce n'est plus un miroir strict d'upstream. Quelque chose a commité sur main."
              exit 1
              ;;
            *)
              echo "::error::réponse inattendue de merge-upstream : $RESULT"
              exit 1
              ;;
          esac

      # Les tags d'upstream ne sont pas recopiés, même avec un PAT. Ils
      # faisaient partie du push rejeté, et leur motif `v*.*.*` est celui sous
      # lequel `fork/release.sh` publie les releases du fork : les recopier
      # garantit une collision le jour où les deux numéros se croisent.

      - name: Mesurer le retard sur upstream
        id: lag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM="$(gh api "repos/$GITHUB_REPOSITORY" -q '.parent.full_name')"
          FORK_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q '.sha')"
          UP_MAIN="$(gh api "repos/$UPSTREAM/commits/main" -q '.sha')"

          # Comparaison faite chez upstream : main est un miroir strict, donc
          # son commit y existe et sert de base valide.
          BEHIND="$(gh api "repos/$UPSTREAM/compare/$FORK_MAIN...$UP_MAIN" -q '.ahead_by')"

          echo "upstream: $UPSTREAM"
          echo "retard: $BEHIND commits"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "- \`main\` est à **$BEHIND** commits derrière \`$UPSTREAM\`" >> "$GITHUB_STEP_SUMMARY"

      # Tourne aussi quand main est déjà à jour. Voulu — la release peut manquer
      # sans nouveaux commits (oubli de publication, échec local).
      #
      # La version est lue chez upstream plutôt que dans un checkout de main :
      # c'est la version que portera la prochaine build du fork, et elle reste
      # juste même quand main du fork n'a pas encore été avancé.
      - name: Signale les versions sans release exploitable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM="$(gh api "repos/$GITHUB_REPOSITORY" -q '.parent.full_name')"
          VERSION="$(gh api "repos/$UPSTREAM/contents/apps/server/package.json?ref=main" \
            -H "Accept: application/vnd.github.raw+json" | jq -r '.version')"
          TAG="v$VERSION"
          echo "version upstream : $VERSION"

          # Exploitable = ni brouillon ni prerelease, et porte les deux assets
          # que electron-updater vient chercher. `gh release view` reussit sur
          # une release brouillon ou sans assets : un `gh release create`
          # interrompu pendant l'upload laisserait sinon la surveillance
          # se taire pour toujours.
          PROBLEM=""
          if INFO="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets 2>/dev/null)"; then
            DRAFT="$(echo "$INFO" | jq -r '.isDraft')"
            PRERELEASE="$(echo "$INFO" | jq -r '.isPrerelease')"
            HAS_APPIMAGE="$(echo "$INFO" | jq -r --arg a "T3-Code-$VERSION-x86_64.AppImage" '[.assets[].name] | index($a) != null')"
            HAS_YML="$(echo "$INFO" | jq -r '[.assets[].name] | index("latest-linux.yml") != null')"
            if [ "$DRAFT" = "true" ]; then
              PROBLEM="elle est en brouillon, et l'updater ne voit pas les brouillons"
            elif [ "$PRERELEASE" = "true" ]; then
              PROBLEM="elle est marquee prerelease, et l'updater (canal latest) ne la voit pas"
            elif [ "$HAS_APPIMAGE" != "true" ] || [ "$HAS_YML" != "true" ]; then
              PRESENT="$(echo "$INFO" | jq -r '[.assets[].name] | if length == 0 then "aucun" else join(", ") end')"
              PROBLEM="elle existe mais il lui manque des assets (attendus : T3-Code-$VERSION-x86_64.AppImage et latest-linux.yml ; presents : $PRESENT). Une release a moitie creee est une release cassee : l'updater telechargerait un 404"
            fi
          else
            PROBLEM="elle n'existe pas"
          fi

          if [ -z "$PROBLEM" ]; then
            echo "release $TAG exploitable, rien à faire"
            echo "- release \`$TAG\` exploitable" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "- release \`$TAG\` : $PROBLEM" >> "$GITHUB_STEP_SUMMARY"

          # Titre stable et contenant la version : une seule issue par version,
          # jamais un doublon à chaque exécution du cron, quel que soit le
          # problème constaté.
          TITLE="Release $TAG absente ou incomplete : mise à jour automatique en attente"
          COUNT="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 \
            --json title --jq "[.[] | select(.title == \"$TITLE\")] | length")"

          if [ "$COUNT" -ne 0 ]; then
            echo "une issue ouverte signale déjà $TAG"
            exit 0
          fi

          cat > /tmp/fork-release-issue.md <<'EOF'
          La release `v$VERSION` ne satisfait pas les conditions de la mise à jour automatique du fork : $PROBLEM.

          Depuis que l'updater des AppImages du fork pointe sur les releases du fork, il ne voit plus celles d'upstream : sans release exploitable du fork, il ne propose plus aucune mise à jour, et on reste sur une vieille build en croyant être à jour.

          Pour produire la release, depuis une machine de dev :

          1. `./fork/sync.sh` — resynchroniser sur upstream
          2. `./fork/build-linux.sh` — construire l'AppImage et ses métadonnées de mise à jour
          3. `./fork/release.sh` — publier la release GitHub

          Ce workflow ne construit pas d'AppImage en CI : la publication est une étape locale et volontaire.
          EOF
          sed -i -e "s|\$VERSION|$VERSION|g" -e "s|\$PROBLEM|$PROBLEM|g" /tmp/fork-release-issue.md

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body-file /tmp/fork-release-issue.md
